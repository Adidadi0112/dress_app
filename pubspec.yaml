name: dress_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  intl: ^0.19.0
  provider: ^6.1.1
  http: ^1.1.0
  mime: ^2.0.0
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  flutter_colorpicker: ^1.0.3
  confetti: ^0.7.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/stickers/

